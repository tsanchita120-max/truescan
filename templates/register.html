<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRUESCAN - Create Account</title>

   <link rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- LOGO -->
        <img src="{{ url_for('static', filename='images/truescan-logo.png') }}"
             class="login-logo"
             alt="TRUESCAN Logo">

        <h1>Create Account</h1>

        <p class="welcome">
            Join TRUESCAN and stay protected
        </p>

        {% if message %}
        <div class="error-message">
            {{ message }}
        </div>
        {% endif %}

        <!-- REGISTER FORM -->

        <form method="POST"
              action="{{ url_for('register') }}">

            <!-- EMAIL -->

            <label>Email Address</label>

            <div class="input-box">

                <span>✉</span>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- PASSWORD -->

            <label>Password</label>

            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword('password')">
                    👁
                </button>

            </div>


            <!-- CONFIRM PASSWORD -->

            <label>Confirm Password</label>

            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword('confirm_password')">
                    👁
                </button>

            </div>


            <!-- REGISTER BUTTON -->

            <button type="submit"
                    class="login-btn">

                CREATE ACCOUNT

            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            <span>OR</span>
        </div>


        <!-- LOGIN LINK -->

        <p class="register-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


        <!-- SECURITY -->

        <p class="security">
            🛡 Your security is our priority
        </p>

    </div>

</div>


<script>

function togglePassword(id) {

    const password =
        document.getElementById(id);

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>

</html>
