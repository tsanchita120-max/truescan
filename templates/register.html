<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TRUESCAN - Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <!-- LOGO -->

        <div class="logo-section">

            <img
                src="{{ url_for('static', filename='images/truescan-logo.png') }}"
                alt="TRUESCAN"
                class="logo"
            >

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your TRUESCAN account
            </p>

        </div>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <!-- REGISTER FORM -->

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-box">

                    <span>👤</span>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <span>✉</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <div class="input-box">

                    <span>📱</span>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter your mobile number"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="4"
                        required
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="input-box">

                    <span>🔐</span>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="4"
                        required
                    >

                </div>

            </div>


            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                class="create-btn"
            >
                CREATE ACCOUNT
            </button>


        </form>


        <!-- LOGIN LINK -->

        <div class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</div>


<!-- PASSWORD VALIDATION -->

<script>

    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {

            event.preventDefault();

            alert("Passwords do not match.");

        }

    });

</script>

</body>

</html>
