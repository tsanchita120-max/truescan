<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TRUESCAN - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- LOGO -->

        <img src="{{ url_for('static', filename='images/truescan-logo.png') }}"
             class="login-logo"
             alt="TRUESCAN Logo">


        <h1>Welcome Back</h1>

        <p class="welcome">
            Login to your TRUESCAN account
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST"
              action="{{ url_for('login') }}">

            <label>Email Address</label>

            <div class="input-box">

                <span>✉</span>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <label>Password</label>

            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

                <button
                    type="button"
                    class="show-btn"
                    onclick="showPassword()">
                    👁
                </button>

            </div>


            <div class="forgot">

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button type="submit"
                    class="login-btn">

                LOGIN

            </button>

        </form>


        <div class="divider">

            <span>OR</span>

        </div>


        <p class="register-text">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>


        <p class="security">

            🛡 Your security is our priority

        </p>

    </div>

</div>


<script>

function showPassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>

</html>
